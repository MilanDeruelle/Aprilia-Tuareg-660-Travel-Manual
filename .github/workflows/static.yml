# Deploy static content to GitHub Pages, with an auto-generated index.html
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate index.html
        run: |
          python3 - <<'EOF'
          import os, html, urllib.parse

          os.chdir('out')  # index only the published folder

          def walk(path, rel):
              entries = sorted(os.scandir(path), key=lambda e: (not e.is_dir(), e.name.lower()))
              items = []
              for e in entries:
                  if e.name.startswith('.'):              # skip .git, .github, dotfiles
                      continue
                  if rel == '' and e.name == 'index.html':  # skip the index itself
                      continue
                  r = rel + e.name
                  if e.is_dir():
                      items.append(f'<li><strong>{html.escape(e.name)}/</strong>{walk(e.path, r + "/")}</li>')
                  else:
                      href = html.escape(urllib.parse.quote(r))
                      items.append(f'<li><a href="{href}">{html.escape(e.name)}</a></li>')
              return '<ul>' + ''.join(items) + '</ul>'

          page = f'''<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Aprilia Tuareg 660 Field Manual</title>
          <style>
            body {{ font-family: system-ui, sans-serif; max-width: 50rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }}
            ul {{ list-style: none; padding-left: 1.2rem; }}
            a {{ text-decoration: none; }} a:hover {{ text-decoration: underline; }}
          </style>
          </head>
          <body>
          <h1>File index</h1>
          {walk('.', '')}
          </body>
          </html>
          '''
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(page)
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
